# Part C: the Part B 2 MB L2, same capacity and periphery, MRAM bitcell.
-DesignTarget: cache
-CacheAccessMode: Normal
-OptimizationTarget: ReadEDP
-EnablePruning: Yes

-ProcessNode: 45
-Capacity (MB): 2
-WordWidth (bit): 512
-Associativity (for cache only): 8
-DeviceRoadmap: HP

-LocalWireType: SemiConservative
-LocalWireRepeaterType: RepeatedNone
-LocalWireUseLowSwing: No
-GlobalWireType: GlobalConservative
