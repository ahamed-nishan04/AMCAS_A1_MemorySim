-Routing: H-tree
-InternalSensing: true
-MemoryCellInputFile: cell_300.cell
-Temperature (K): 350
-BufferDesignOptimization: latency
-ForceBank (Total AxB, Active CxD): 2x2, 1x1
-UseCactiAssumption: Yes
